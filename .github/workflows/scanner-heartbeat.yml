name: Scanner Heartbeat

on:
  schedule:
    # 10:00 BRT (13 UTC), once per day — after the morning scanner run
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Check heartbeat
        working-directory: bot
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_IDS: ${{ secrets.ALERT_CHAT_IDS }}
        run: python -m scanner.heartbeat
