name: Scanner Resumo Diário

on:
  schedule:
    # 21h BRT (00 UTC do dia seguinte)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Run daily summary
        working-directory: bot
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PLANILHA_ANTIGA_ID: ${{ secrets.PLANILHA_ANTIGA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_IDS: ${{ secrets.ALERT_CHAT_IDS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CEP_ENTREGA: ${{ secrets.CEP_ENTREGA }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m scanner.daily_summary
