name: Scanner Resumo Semanal

# Weekly proof-of-life pulse: confirms the scanner is running and lists the
# cheapest delivered unit price per insumo over the last 7 days. Always sends
# (unlike the daily summary, which only fires when an offer hit), so stable
# prices no longer read as "is it broken?" silence.

on:
  schedule:
    # Segunda 08h BRT (11 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Run weekly summary
        working-directory: bot
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_IDS: ${{ secrets.ALERT_CHAT_IDS }}
          SUMMARY_CHAT_IDS: ${{ secrets.SUMMARY_CHAT_IDS }}
        run: python -m scanner.weekly_summary
