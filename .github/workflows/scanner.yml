name: Scanner de Preços

on:
  schedule:
    # Runs 2x/day in BRT (UTC-3):
    - cron: '0 11 * * *'  # 08:00 BRT
    - cron: '0 23 * * *'  # 20:00 BRT
  workflow_dispatch:  # allow manual trigger from Actions UI

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Run scanner
        working-directory: bot
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_IDS: ${{ secrets.ALERT_CHAT_IDS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CEP_ENTREGA: ${{ secrets.CEP_ENTREGA }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python -m scanner.runner
